<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
  href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <link rel="stylesheet" href="./css/design.css">

  <title>Diseño</title>
</head>

<body>

<div class="container mt-5">

  <h1 class="text-center">
    🎨 Sensores del Proyecto
  </h1>

  <div class="row mt-5">

    <div class="col-md-4">

      <div class="card p-4 shadow sensor">

        <h2>📡 HC-SR04</h2>

        <p>
          Detecta movimiento y presencia.
        </p>

      </div>

    </div>

    <div class="col-md-4">

      <div class="card p-4 shadow sensor">

        <h2>🔥 MQ-2</h2>

        <p>
          Detecta humo y fugas de gas.
        </p>

      </div>

    </div>

    <div class="col-md-4">

      <div class="card p-4 shadow sensor">

        <h2>💧 FC-29</h2>

        <p>
          Detecta humedad para riego.
        </p>

      </div>

    </div>

  </div>

</div>

</html>
